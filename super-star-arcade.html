<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Super Star Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Luckiest+Guy&family=Orbitron:wght@700;900&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0d0916; --ink:#f4efff; --muted:#a99cc4; --gold:#ffd21f; --panel:#1d1433; --line:#3a2c5c; --pink:#ff4fd8;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 45%,#2a1640 0%,var(--bg) 70%);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;
  display:grid;place-items:center;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#face{position:relative;width:min(94vw,94vh);height:min(94vw,94vh);border-radius:12px;cursor:pointer;touch-action:none;-webkit-touch-callout:none;
  box-shadow:0 0 0 5px #d5d9e0,0 0 0 7px #9aa0aa,0 0 50px 8px rgba(255,79,216,.35),0 24px 60px rgba(0,0,0,.7)}
#face svg{width:100%;height:100%;display:block;border-radius:12px}

/* tube */
.seg .glow{opacity:.3;transition:opacity .12s}
.seg .dash{opacity:.45;animation:dash .6s linear infinite}
.seg.on .glow{opacity:1}
.seg.on .dash{opacity:1}
@keyframes dash{to{stroke-dashoffset:-16}}
body[data-mode=spin] .seg .dash{animation-duration:.25s}
.leds{animation:twinkle 1.2s steps(2) infinite}
@keyframes twinkle{50%{opacity:.55}}

/* numbers */
.num{transform-box:fill-box;transform-origin:center;transition:transform .12s}
.num.hit{transform:scale(1.15)}
.num.hit .disc,.num.win .disc{fill:var(--c)}
.num.hit text,.num.win text{fill:#fff}
.num.win{animation:numwin .3s infinite alternate}
@keyframes numwin{from{transform:scale(1)}to{transform:scale(1.25)}}
.num.miss .disc{fill:rgba(255,255,255,.85)}

/* toast */
#toast{position:absolute;left:0;right:0;top:39%;display:flex;justify-content:center;pointer-events:none}
#toast .box{opacity:0;transform:scale(.4);background:rgba(20,10,45,.9);border:3px solid var(--gold);border-radius:14px;padding:.5em 1.4em .4em;text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:min(2.5vw,2.5vh)}
#toast.show .box{animation:pop .4s cubic-bezier(.3,1.6,.5,1) forwards}
#toast.idle .box{animation:pop .4s forwards,pulse 1.2s .4s ease-in-out infinite alternate}
#toast h2{margin:0;font:400 2.3em/1 'Luckiest Guy',Impact,sans-serif;letter-spacing:.04em;color:var(--gold)}
#toast p{margin:.2em 0 0;font-weight:600;font-size:1em;color:#d9ccff}
@keyframes pop{to{opacity:1;transform:scale(1)}}
@keyframes pulse{to{transform:scale(1.06)}}

/* settings */
#gear{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:rgba(29,20,51,.8);color:var(--ink);font-size:20px;cursor:pointer;z-index:5}
#gear:focus-visible,.seg-btns button:focus-visible,#close:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#settings{position:fixed;inset:0;display:none;place-items:center;background:rgba(5,2,12,.65);z-index:10;padding:16px}
#settings.show{display:grid}
.card{width:min(400px,100%);background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:20px 20px 16px}
.card h1{margin:0 0 6px;font:400 26px 'Luckiest Guy',Impact,sans-serif;letter-spacing:.04em;color:var(--gold);text-align:center}
.opt{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.seg-btns{display:flex;gap:4px;flex-wrap:wrap}
.seg-btns button{border:1px solid #6b5bd6;background:transparent;color:var(--ink);border-radius:8px;padding:5px 9px;font:600 13px Fredoka,sans-serif;cursor:pointer}
.seg-btns button.sel{background:var(--gold);color:#1b1040;border-color:var(--gold)}
.slider{display:flex;align-items:center;gap:10px;flex:1 1 220px;justify-content:flex-end}
.slider input{flex:1;min-width:0;accent-color:var(--gold);cursor:pointer}
.slider output{min-width:96px;text-align:right;font:700 13px Orbitron,monospace;color:var(--gold);font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:13px;line-height:1.4;margin:12px 0}
#close{display:block;margin:6px auto 0;border:none;border-radius:12px;padding:10px 28px;font:400 18px 'Luckiest Guy',Impact,sans-serif;letter-spacing:.04em;
  color:#fff;background:linear-gradient(#ff5252,#c4001d);box-shadow:0 4px 0 #7a0010;cursor:pointer}
@media (prefers-reduced-motion:reduce){.seg .dash,.leds,.num.win,#toast.idle .box{animation:none!important}#toast .box{opacity:1;transform:none}}
</style>
</head>
<body data-mode="idle">

<div id="face" aria-label="Super Star clock. Press and hold to spin, release to stop." role="button" tabindex="0">
  <svg id="clock" viewBox="0 0 400 400"></svg>
  <div id="toast" class="idle"><div class="box"><h2 id="toastH">PRESS &amp; HOLD</h2><p id="toastP">Release when the ★ is on a number</p></div></div>
</div>

<button id="gear" aria-label="Settings">⚙</button>

<div id="settings"><div class="card">
  <h1>SETTINGS</h1>
  <div class="opt"><span>Difficulty</span><div class="seg-btns" id="diffBtns"></div></div>
  <div class="opt"><label for="speedRange">Hand speed</label><div class="slider"><input type="range" id="speedRange" min="0.4" max="2.5" step="0.05" value="1"><output id="speedVal" for="speedRange">1.00×</output></div></div>
  <div class="opt"><span>Sound</span><div class="seg-btns" id="sndBtns"><button data-v="1">On</button><button data-v="0">Off</button></div></div>
  <p class="note">Hold the clock (or <b>Space</b>) to spin the hand. Let go when the star is on a number. Difficulty sets how close to the centre of a number you must stop.</p>
  <button id="close">CLOSE</button>
</div></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const mod=(a,n)=>((a%n)+n)%n;

/* ---------- geometry ---------- */
const COLORS=['','#e01b24','#ff4a12','#f5a400','#3dbb2e','#1565c0','#1a237e','#c2185b'];
const STEP=360/7;
const centerOf=n=>(n-.5)*STEP;                 // 1 at 25.7°, 4 at the bottom, 7 at 334.3°
const P=(r,deg)=>{const a=deg*Math.PI/180;return[200+r*Math.sin(a),200-r*Math.cos(a)];};
const W=(g,x,r)=>{const a=g*Math.PI/180;return[200+r*Math.sin(a)+x*Math.cos(a),200-r*Math.cos(a)+x*Math.sin(a)];};
const f2=p=>p.map(v=>v.toFixed(2)).join(' ');
function starPts(R,r,cx,cy,k=5){let s=[];for(let i=0;i<k*2;i++){const rr=i%2?r:R,a=i*180/k*Math.PI/180;s.push((cx+rr*Math.sin(a)).toFixed(2)+','+(cy-rr*Math.cos(a)).toFixed(2));}return s.join(' ');}
function wedge(r,a0,a1){return`M200 200 L${f2(P(r,a0))} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${f2(P(r,a1))}Z`;}
const NR=148;                                   // radius of the number ring (and of the star tip)

/* ---------- build the face ---------- */
const svg=$('#clock'),defs=el('defs',{},svg);
defs.innerHTML=`
<radialGradient id="panel" cx="50%" cy="48%" r="70%"><stop offset="0" stop-color="#fefcff"/><stop offset=".6" stop-color="#f1e9fb"/><stop offset="1" stop-color="#dcc9f0"/></radialGradient>
<filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="hs" x="-40%" y="-20%" width="180%" height="140%"><feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#2a0b3a" flood-opacity=".45"/></filter>
<radialGradient id="steel" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c9ccd3"/><stop offset="1" stop-color="#7d828c"/></radialGradient>
<linearGradient id="stemG" gradientUnits="userSpaceOnUse" x1="0" y1="72" x2="0" y2="185"><stop offset="0" stop-color="#7a2a16"/><stop offset=".35" stop-color="#b9271f"/><stop offset="1" stop-color="#e3262b"/></linearGradient>
<linearGradient id="tailG" gradientUnits="userSpaceOnUse" x1="0" y1="225" x2="0" y2="318"><stop offset="0" stop-color="#4a1f8f"/><stop offset="1" stop-color="#1d2470"/></linearGradient>`;

el('rect',{x:0,y:0,width:400,height:400,rx:10,fill:'url(#panel)'},svg);
el('rect',{x:2,y:2,width:396,height:396,rx:9,fill:'none',stroke:'#ff8ae6','stroke-width':3,opacity:.6,filter:'url(#blur)'},svg);
for(const [x,y] of[[16,16],[16,384],[384,384]]){el('circle',{cx:x,cy:y,r:5.5,fill:'url(#steel)',stroke:'#7d828c','stroke-width':1},svg);el('line',{x1:x-3,y1:y,x2:x+3,y2:y,stroke:'#6b7079','stroke-width':1.3},svg);}

// white LED strip behind the acrylic
{const g=el('g',{class:'leds',filter:'url(#glow)'},svg);for(let y=10;y<=392;y+=9)el('circle',{cx:62,cy:y,r:1.5,fill:'#fff'},g);}

// pink neon tube: a tab around every number and a stepped tooth reaching in toward the hub between numbers
const TAB=15;                                   // half-angle of a number's tab
const TOOTH=[[-18,145],[-18,131],[-10,131],[-10,115],[0,115]];   // outer -> tip, on the side before the gap
const segs=[];
for(let n=1;n<=7;n++){
  const c=centerOf(n),gPrev=(n-1)*STEP,gNext=n*STEP;
  const inPts=TOOTH.slice().reverse().map(([x,r])=>W(gPrev,-x,r));
  const outPts=TOOTH.map(([x,r])=>W(gNext,x,r));
  let d=`M${f2(inPts[0])}`+inPts.slice(1).map(p=>` L${f2(p)}`).join('');
  d+=` L${f2(P(147,c-TAB))} L${f2(P(178,c-TAB))} Q${f2(P(186,c-TAB))} ${f2(P(186,c-TAB+3))}`;
  d+=` A186 186 0 0 1 ${f2(P(186,c+TAB-3))} Q${f2(P(186,c+TAB))} ${f2(P(178,c+TAB))} L${f2(P(147,c+TAB))}`;
  d+=outPts.map(p=>` L${f2(p)}`).join('');
  const g=el('g',{class:'seg'},svg);
  el('path',{d,class:'glow',fill:'none',stroke:'#ff5fe0','stroke-width':13,'stroke-linejoin':'round','stroke-linecap':'round',filter:'url(#blur)'},g);
  el('path',{d,fill:'none',stroke:'#ff4fd8','stroke-width':5.5,'stroke-linejoin':'round','stroke-linecap':'round'},g);
  el('path',{d,class:'dash',fill:'none',stroke:'#fff','stroke-width':3,'stroke-dasharray':'6 10','stroke-linejoin':'round'},g);
  el('path',{d,fill:'none',stroke:'#ffe3fa','stroke-width':1.2,opacity:.85},g);
  segs[n]=g;
}
// standoff screws between the numbers
for(let k=0;k<7;k++){const [x,y]=W(k*STEP,0,151);el('circle',{cx:x,cy:y,r:6,fill:'url(#steel)',stroke:'#6b7079','stroke-width':1},svg);el('circle',{cx:x,cy:y,r:2.4,fill:'#4a4e56'},svg);}

// numbers
const nums=[];
for(let n=1;n<=7;n++){
  const [x,y]=P(NR,centerOf(n)),g=el('g',{class:'num'},svg);g.style.setProperty('--c',COLORS[n]);
  el('circle',{cx:x,cy:y,r:30,fill:'rgba(255,255,255,.35)',stroke:COLORS[n],'stroke-width':2.5,class:'disc'},g);
  el('text',{x,y:y+14.5,'text-anchor':'middle','font-family':'"Archivo Black","Arial Black",Impact,sans-serif','font-size':40,fill:COLORS[n]},g).textContent=n;
  nums[n]=g;
}

// TIME display
el('text',{x:355,y:21,'text-anchor':'middle','font-family':'"Luckiest Guy",Impact,sans-serif','font-size':18,fill:'#e2b419',stroke:'#3a2a00','stroke-width':2.2,'paint-order':'stroke','letter-spacing':1},svg).textContent='TIME';
el('rect',{x:322,y:25,width:66,height:25,rx:3,fill:'#140606',stroke:'#45464d','stroke-width':1.5},svg);
el('text',{x:355,y:43.5,'text-anchor':'middle','font-family':'Orbitron,monospace','font-weight':900,'font-size':16,fill:'#3a0707'},svg).textContent='88.8';
const timeTxt=el('text',{x:355,y:43.5,'text-anchor':'middle','font-family':'Orbitron,monospace','font-weight':900,'font-size':16,fill:'#ff2a1f',filter:'url(#glow)'},svg);

// big grooved colour disc
for(const [a0,a1,col] of[[0,90,'#e8262b'],[90,140,'#f7781d'],[140,175,'#f9b320'],[175,200,'#3fb34f'],[200,260,'#1f78d1'],[260,300,'#1f2a7a'],[300,360,'#7b2a9e']])
  el('path',{d:wedge(82,a0,a1),fill:col},svg);
for(let r=33;r<=80;r+=3.6)el('circle',{cx:200,cy:200,r:r.toFixed(1),fill:'none',stroke:'#fff','stroke-width':.7,opacity:.22},svg);
el('circle',{cx:200,cy:200,r:82,fill:'none',stroke:'#1d1b33','stroke-width':3},svg);
{const [lx,ly]=P(58,122);
 el('text',{x:lx,y:ly-1,'text-anchor':'middle','font-family':'"Luckiest Guy",Impact,sans-serif','font-size':9,fill:'#ffd21f',stroke:'#c2185b','stroke-width':1.6,'paint-order':'stroke'},svg).textContent='SUPER';
 el('text',{x:lx,y:ly+8,'text-anchor':'middle','font-family':'"Luckiest Guy",Impact,sans-serif','font-size':9,fill:'#ffd21f',stroke:'#c2185b','stroke-width':1.6,'paint-order':'stroke'},svg).textContent='STAR';
 el('polygon',{points:starPts(5,2.1,lx+17,ly+2),fill:'#ff4fa3',stroke:'#fff','stroke-width':.8},svg);}

// the hand (rotates as one piece): navy tail, red stem, white edge, gold star, hub wheel
const hand=el('g',{filter:'url(#hs)'},svg);
const TAIL='M182 226 C181 260 178 292 175 318 L227 304 C223 280 220 254 218 226Z';
const STEM='M187 182 C186 150 195 112 194 76 L206 76 C207 112 214 150 213 182Z';
const SY=200-NR;
const edge={fill:'#fff',stroke:'#fff','stroke-width':9,'stroke-linejoin':'round'};
el('path',{d:TAIL,...edge},hand);el('path',{d:STEM,...edge},hand);el('circle',{cx:200,cy:200,r:33,...edge},hand);
el('polygon',{points:starPts(30,13,200,SY),...edge,'stroke-width':6},hand);
el('path',{d:TAIL,fill:'url(#tailG)'},hand);
for(const [x,y] of[[192,250],[205,272],[189,292],[212,290],[200,236]])el('polygon',{points:starPts(2.6,1.1,x,y),fill:'#fff',opacity:.5},hand);
el('path',{d:STEM,fill:'url(#stemG)'},hand);
for(const [x,y] of[[199,110],[202,140],[197,160],[203,95]])el('circle',{cx:x,cy:y,r:.9,fill:'#ffd76a',opacity:.8},hand);
el('polygon',{points:starPts(28,12,200,SY),fill:'#3a2a10','stroke-linejoin':'round'},hand);
el('polygon',{points:starPts(25,10.7,200,SY),fill:'#ffd21f'},hand);
el('polygon',{points:starPts(17.5,7.5,200,SY),fill:'#5a3d0c'},hand);
el('polygon',{points:starPts(15.5,6.6,200,SY),fill:'#ffc400'},hand);
el('polygon',{points:starPts(7,3,200,SY),fill:'#1a237e'},hand);
{const IW=['#43b649','#1e88e5','#1a237e','#e53935','#fb8c00','#fdd835'];
 IW.forEach((col,i)=>el('path',{d:wedge(27,i*60-30,i*60+30),fill:col},hand));
 for(let r=17;r<=26;r+=3)el('circle',{cx:200,cy:200,r,fill:'none',stroke:'#fff','stroke-width':.6,opacity:.25},hand);
 el('circle',{cx:200,cy:200,r:15,fill:'#fff',stroke:'#1a237e','stroke-width':1.2},hand);
 el('polygon',{points:starPts(13.5,4.2,200,200,16),fill:'#1a237e'},hand);
 el('polygon',{points:starPts(9,3.2,200,200,8),fill:'#3f51b5'},hand);
 el('circle',{cx:200,cy:200,r:4.2,fill:'url(#steel)',stroke:'#555','stroke-width':.8},hand);}

/* ---------- settings ---------- */
const DIFF={easy:{tol:7,max:220,label:'Easy'},normal:{tol:4.5,max:300,label:'Normal'},hard:{tol:2.8,max:400,label:'Hard'},expert:{tol:1.6,max:520,label:'Expert'}};
const SPEED_MIN=.4,SPEED_MAX=2.5,KEY='superstar.face.v1';
let cfg={diff:'normal',speed:1,sound:true};
try{Object.assign(cfg,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
if(!DIFF[cfg.diff])cfg.diff='normal';
cfg.speed=Number(cfg.speed);if(!(cfg.speed>=SPEED_MIN&&cfg.speed<=SPEED_MAX))cfg.speed=1;
cfg.sound=cfg.sound!==false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(cfg));}catch(e){}}

/* ---------- audio ---------- */
let AC=null,master=null;
function ensureAudio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.35;master.connect(AC.destination);}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(freq,dur,type='square',vol=.3,when=0,slideTo){
  if(!AC||!cfg.sound)return;
  const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);
}
const SFX={
  tick(){tone(2400,.022,'triangle',.16);},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.16,'square',.2,i*.11));[1568,1760,1568,1760,2093,2093].forEach((f,i)=>tone(f,.1,'triangle',.18,.85+i*.09));},
  lose(){tone(420,.55,'sawtooth',.18,0,110);},
  beep(){tone(1500,.07,'square',.14);},
};

/* ---------- UI ---------- */
let toastTimer;
function toast(h,p,color,cls='show',ms=2300){
  $('#toastH').textContent=h;$('#toastH').style.color=color||'';$('#toastP').textContent=p||'';
  const t=$('#toast');t.className='';void t.offsetWidth;t.className=cls;clearTimeout(toastTimer);if(ms)toastTimer=setTimeout(()=>{t.className='';},ms);
}
function hideToast(){clearTimeout(toastTimer);$('#toast').className='';}
function setMode(m){document.body.dataset.mode=m;}
function flashNum(n,cls='hit',ms=140){nums[n].classList.add(cls);setTimeout(()=>nums[n].classList.remove(cls),ms);}

/* ---------- game ---------- */
const TIME_LIMIT=20;
let state='idle',angle=0,speed=0,timeLeft=TIME_LIMIT,holding=false,auto=false,autoStop=0,pressed=false,last=performance.now(),lastBeep=99;
const segAt=a=>Math.floor(mod(a,360)/STEP)+1;

function startSpin(isAuto){
  state='spin';holding=!isAuto;auto=isAuto;speed=60;autoStop=performance.now()+1500+Math.random()*2500;
  setMode('spin');hideToast();if(isAuto)toast('TIME UP!','Auto spin…','#ff9800','show',1200);
}
function advance(dt){
  const m=cfg.speed;speed=Math.min(DIFF[cfg.diff].max*m,speed+750*m*dt);
  const prev=angle;angle+=speed*dt;
  for(let n=1;n<=7;n++){const c=centerOf(n);if(Math.floor((angle-c)/360)>Math.floor((prev-c)/360)){SFX.tick();flashNum(n);}}
}
function stopHand(){
  if(state!=='spin')return;
  const now=performance.now();advance(Math.max(0,(now-last)/1000));last=now;
  const wasAuto=auto;holding=false;auto=false;state='result';
  const a=mod(angle,360),tol=DIFF[cfg.diff].tol;let best=null;
  for(let n=1;n<=7;n++){const d=Math.abs(mod(a-centerOf(n)+180,360)-180);if(!best||d<best.d)best={n,d};}
  const off=best.d.toFixed(1)+'°';
  if(best.d<=tol){
    setMode('win');SFX.win();nums[best.n].classList.add('win');
    toast('WINNER!',best.d<.6?`Perfect stop on ${best.n}!`:`Number ${best.n} · ${off} from centre`,'','show',3000);
    setTimeout(()=>{nums[best.n].classList.remove('win');resetHand(wasAuto);},3000);
  }else{
    setMode('lose');SFX.lose();flashNum(best.n,'miss',1800);
    const close=best.d<tol*2.2;
    toast(close?'SO CLOSE!':'MISSED',`${off} away from ${best.n}`,close?'#ff9800':'#ff5252');
    setTimeout(()=>resetHand(wasAuto),2300);
  }
}
let goIdle=false;
function resetHand(toIdle){state='reset';setMode('idle');goIdle=toIdle;}
function afterReset(){
  angle=0;
  if(goIdle){state='idle';timeLeft=TIME_LIMIT;setMode('idle');toast('PRESS & HOLD','Release when the ★ is on a number','','idle',0);}
  else{state='ready';timeLeft=TIME_LIMIT;lastBeep=99;setMode('ready');}
}

/* ---------- input ---------- */
function press(){
  ensureAudio();if(pressed)return;pressed=true;
  if(state==='idle'||state==='ready')startSpin(false);
}
function release(){if(!pressed)return;pressed=false;if(state==='spin'&&holding)stopHand();}
const face=$('#face');
face.addEventListener('pointerdown',e=>{e.preventDefault();try{face.setPointerCapture(e.pointerId);}catch(_){}press();});
face.addEventListener('pointerup',release);face.addEventListener('pointercancel',release);face.addEventListener('lostpointercapture',release);
face.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',release);
const settings=$('#settings');
addEventListener('keydown',e=>{
  if(e.code==='Escape'){settings.classList.remove('show');return;}
  if(settings.classList.contains('show'))return;
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!e.repeat)press();}
});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();release();}});

const diffBtns=$('#diffBtns'),speedRange=$('#speedRange');
for(const k in DIFF){const b=document.createElement('button');b.dataset.v=k;b.textContent=DIFF[k].label;diffBtns.appendChild(b);}
function renderSettings(){
  diffBtns.querySelectorAll('button').forEach(b=>b.classList.toggle('sel',b.dataset.v===cfg.diff));
  $('#sndBtns').querySelectorAll('button').forEach(b=>b.classList.toggle('sel',(b.dataset.v==='1')===cfg.sound));
  speedRange.value=cfg.speed;$('#speedVal').textContent=`${cfg.speed.toFixed(2)}× · ${Math.round(DIFF[cfg.diff].max*cfg.speed/6)} RPM`;
}
$('#gear').addEventListener('click',()=>{renderSettings();settings.classList.add('show');});
$('#close').addEventListener('click',()=>settings.classList.remove('show'));
settings.addEventListener('click',e=>{if(e.target===settings)settings.classList.remove('show');});
diffBtns.addEventListener('click',e=>{const v=e.target.dataset.v;if(v){cfg.diff=v;save();renderSettings();}});
$('#sndBtns').addEventListener('click',e=>{const v=e.target.dataset.v;if(v){cfg.sound=v==='1';save();renderSettings();}});
speedRange.addEventListener('input',()=>{cfg.speed=Number(speedRange.value);save();renderSettings();});

/* ---------- loop ---------- */
let litKey='';
function renderLeds(now){
  const m=document.body.dataset.mode,on=new Set();
  if(m==='idle'||m==='ready'){const k=Math.floor(now/(m==='ready'?110:200))%7;on.add(k+1);}
  else if(m==='spin')on.add(segAt(angle));
  else if(m==='win'){if(Math.floor(now/110)%2)for(let n=1;n<=7;n++)on.add(n);}
  const key=[...on].join(',');
  if(key!==litKey){litKey=key;for(let n=1;n<=7;n++)segs[n].classList.toggle('on',on.has(n));}
}
function frame(){
  const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='spin'){advance(dt);if(auto&&now>=autoStop)stopHand();}
  if(state==='ready'||(state==='spin'&&holding)){
    timeLeft=Math.max(0,timeLeft-dt);
    const sec=Math.ceil(timeLeft);
    if(state==='ready'&&sec<=5&&sec>0&&sec<lastBeep){lastBeep=sec;SFX.beep();}
    if(timeLeft<=0){if(state==='ready')startSpin(true);else{pressed=false;stopHand();}}
  }
  if(state==='reset'){const target=Math.ceil(angle/360-1e-9)*360;angle=Math.min(target,angle+300*dt);if(angle>=target)afterReset();}
  timeTxt.textContent=timeLeft.toFixed(1).padStart(4,'0');
  hand.setAttribute('transform',`rotate(${mod(angle,360).toFixed(3)} 200 200)`);
  renderLeds(now);
  requestAnimationFrame(frame);
}
renderSettings();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
